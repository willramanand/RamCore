name: RamCore
version: '${project.version}'
main: dev.willram.ramcore.RamCore
description: Paper/Folia plugin utility library with lifecycle, command, scheduling, event, data, GUI, and gameplay platform APIs.
authors:
  - willramanand
api-version: '26.1.2'
folia-supported: true
dependencies:
  server:
    ProtocolLib:
      load: BEFORE
      required: false
      # This means that your plugin will not have access to their classpath
      join-classpath: true
permissions:
  ramcore.diagnostics:
    description: Allows use of RamCore diagnostic commands.
    default: op
